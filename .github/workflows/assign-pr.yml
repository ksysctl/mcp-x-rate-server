name: Assign PR

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign ksysctl
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.addAssignees({
              ...context.repo,
              issue_number: context.issue.number,
              assignees: ["ksysctl"],
            });
