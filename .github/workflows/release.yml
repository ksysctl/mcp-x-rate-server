name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to publish or retry
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7

      - name: Detect release branch version
        id: release-version
        uses: actions/github-script@v8
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,
              commit_sha: context.sha,
            });

            const releasePr = prs.data.find((pr) =>
              pr.merged_at &&
              /^release\/v\d+\.\d+\.\d+$/.test(pr.head.ref)
            );

            if (!releasePr) {
              core.setOutput("version", "");
              return;
            }

            const version = releasePr.head.ref.slice("release/v".length);
            core.setOutput("version", version);
            core.info(`Detected release version ${version} from ${releasePr.head.ref}`);

      - name: Configure requested release version
        if: steps.release-version.outputs.version != ''
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync("release-please-config.json", "utf8"));
            config.packages["."]["release-as"] = process.env.RELEASE_VERSION;
            fs.writeFileSync("release-please.release-as.json", JSON.stringify(config, null, 2));
          '

      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: ${{ steps.release-version.outputs.version != '' && 'release-please.release-as.json' || 'release-please-config.json' }}

      - name: Assign release PRs to ksysctl
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/github-script@v8
        env:
          PULL_REQUESTS: ${{ steps.release.outputs.prs }}
        with:
          script: |
            const pullRequests = JSON.parse(process.env.PULL_REQUESTS ?? "[]");

            for (const pullRequest of pullRequests) {
              await github.rest.issues.addAssignees({
                ...context.repo,
                issue_number: pullRequest.number,
                assignees: ["ksysctl"],
              });
            }

  publish:
    needs: release-please
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || needs.release-please.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build package before publishing
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
