name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to publish or retry
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created || 'false' }}
      tag_name: ${{ steps.release.outputs.tag_name || '' }}
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7

      - name: Detect authorized release merge
        id: release-source
        uses: actions/github-script@v8
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,
              commit_sha: context.sha,
            });

            const releasePr = prs.data.find((pr) =>
              pr.merged_at &&
              /^release\/v\d+\.\d+\.\d+$/.test(pr.head.ref)
            );

            const releasePleasePr = prs.data.find((pr) =>
              pr.merged_at &&
              pr.head.ref.startsWith("release-please--")
            );

            if (!releasePr) {
              core.setOutput("version", "");
            } else {
              const version = releasePr.head.ref.slice("release/v".length);
              core.setOutput("version", version);
              core.info(`Detected release version ${version} from ${releasePr.head.ref}`);
            }

            if (releasePr || releasePleasePr) {
              core.setOutput("authorized", "true");
              core.info("Authorized release merge detected");
            } else {
              core.setOutput("authorized", "false");

              const ordinaryPr = prs.data.find((pr) => pr.merged_at);
              const branch = ordinaryPr?.head.ref ?? "";
              const commitMessage = context.payload.head_commit?.message ?? "";
              const conventionalPrefix =
                /^(feat|fix)(\([^)]*\))?!?:/i.test(commitMessage);
              const branchPrefix =
                /^(feat|fix)(\/|-)/i.test(branch);

              if (conventionalPrefix || branchPrefix) {
                core.info(
                  `Release Please skipped: detected feat/fix commit or branch (${branch || "direct push"}).`
                );
              } else {
                core.info("Release Please skipped: push is not from an authorized release merge.");
              }
            }

      - name: Create or update release PR
        id: release
        if: steps.release-source.outputs.authorized == 'true' && steps.release-source.outputs.version == ''
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release PR with branch version
        if: steps.release-source.outputs.authorized == 'true' && steps.release-source.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release-source.outputs.version }}
        run: |
          npx --yes release-please release-pr \
            --token "$GH_TOKEN" \
            --repo-url ksysctl/mcp-x-rate-server \
            --target-branch main \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json \
            --release-as "$RELEASE_VERSION"

      - name: Assign release PRs to ksysctl
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/github-script@v8
        env:
          PULL_REQUESTS: ${{ steps.release.outputs.prs }}
        with:
          script: |
            const pullRequests = JSON.parse(process.env.PULL_REQUESTS ?? "[]");

            for (const pullRequest of pullRequests) {
              await github.rest.issues.addAssignees({
                ...context.repo,
                issue_number: pullRequest.number,
                assignees: ["ksysctl"],
              });
            }

      - name: Assign CLI-created release PR
        if: steps.release-source.outputs.authorized == 'true' && steps.release-source.outputs.version != ''
        uses: actions/github-script@v8
        with:
          script: |
            const prs = await github.rest.pulls.list({
              ...context.repo,
              state: "open",
              head: "ksysctl:release-please--branches--main--components--dgt-x-rate-mcp",
            });

            for (const pullRequest of prs.data) {
              await github.rest.issues.addAssignees({
                ...context.repo,
                issue_number: pullRequest.number,
                assignees: ["ksysctl"],
              });
            }

  publish:
    needs: release-please
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || needs.release-please.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build package before publishing
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
